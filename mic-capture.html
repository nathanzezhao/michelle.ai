<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  const { ipcRenderer } = require('electron')

  let wavCapture = null

  function mergeFloat32(chunks) {
    let len = 0
    for (const c of chunks) len += c.length
    const out = new Float32Array(len)
    let off = 0
    for (const c of chunks) {
      out.set(c, off)
      off += c.length
    }
    return out
  }

  function resampleTo16k(input, fromRate) {
    if (!fromRate || Math.abs(fromRate - 16000) < 1) return input
    const ratio = fromRate / 16000
    const outLen = Math.max(0, Math.round(input.length / ratio))
    const out = new Float32Array(outLen)
    for (let i = 0; i < outLen; i++) {
      const src = i * ratio
      const i0 = Math.floor(src)
      const i1 = Math.min(i0 + 1, input.length - 1)
      const frac = src - i0
      out[i] = input[i0] * (1 - frac) + input[i1] * frac
    }
    return out
  }

  function encodeWavPcm16(float32, sampleRate) {
    const dataSize = float32.length * 2
    const buffer = new ArrayBuffer(44 + dataSize)
    const view = new DataView(buffer)
    function writeString(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i))
    }
    writeString(0, 'RIFF')
    view.setUint32(4, 36 + dataSize, true)
    writeString(8, 'WAVE')
    writeString(12, 'fmt ')
    view.setUint32(16, 16, true)
    view.setUint16(20, 1, true)
    view.setUint16(22, 1, true)
    view.setUint32(24, sampleRate, true)
    view.setUint32(28, sampleRate * 2, true)
    view.setUint16(32, 2, true)
    view.setUint16(34, 16, true)
    writeString(36, 'data')
    view.setUint32(40, dataSize, true)
    let offset = 44
    for (let i = 0; i < float32.length; i++) {
      const s = Math.max(-1, Math.min(1, float32[i]))
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true)
      offset += 2
    }
    return buffer
  }

  async function startWavCapture() {
    if (wavCapture) return
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
    })
    const ctx = new AudioContext({ sampleRate: 16000 })
    await ctx.resume()
    const source = ctx.createMediaStreamSource(stream)
    const processor = ctx.createScriptProcessor(4096, 1, 1)
    const mute = ctx.createGain()
    mute.gain.value = 0
    const chunks = []
    processor.onaudioprocess = (e) => {
      chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))
    }
    source.connect(processor)
    processor.connect(mute)
    mute.connect(ctx.destination)
    wavCapture = { stream, ctx, source, processor, mute, chunks }
  }

  function stopWavCapture() {
    if (!wavCapture) return null
    const { stream, ctx, source, processor, mute, chunks } = wavCapture
    processor.onaudioprocess = null
    try { processor.disconnect() } catch (e) {}
    try { source.disconnect() } catch (e) {}
    try { mute.disconnect() } catch (e) {}
    stream.getTracks().forEach((t) => t.stop())
    const rate = ctx.sampleRate
    ctx.close()
    wavCapture = null
    if (!chunks.length) return null
    const pcm = resampleTo16k(mergeFloat32(chunks), rate)
    if (!pcm.length) return null
    return encodeWavPcm16(pcm, 16000)
  }

  ipcRenderer.on('mic:start', async (_event, id) => {
    try {
      await startWavCapture()
      ipcRenderer.send('mic:started', id)
    } catch (err) {
      ipcRenderer.send('mic:start-failed', id, {
        name: err && err.name,
        message: err && err.message
      })
    }
  })

  ipcRenderer.on('mic:stop', (_event, id) => {
    const buffer = stopWavCapture()
    ipcRenderer.send('mic:stopped', id, buffer ? Buffer.from(buffer) : null)
  })
</script>
</body>
</html>
