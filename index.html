<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<style>



@keyframes breathe {
  0% { transform: scale(0.8); opacity: 0.1; }
  50% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(0.8); opacity: 0.1; }
}


.loading-dot {
  width: 12px;
  height: 12px;
  background-color: black; 
  border-radius: 50%;
  display: inline-block;
  margin: 4px; 
  animation: breathe 1.2s infinite ease-in-out;
}

.thinking {
  animation: pulse 1s infinite ease-in-out;
}
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    transition: background 0.3s;
    background: rgba(233, 233, 246, 0.35);
    font-family: sans-serif;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 16px;
    border-radius: 16px;
  }

  #header {
    position: relative;
    height: 40px;
    margin-bottom: 12px;
    -webkit-app-region: drag;
    font-family: 'DM Mono', monospace;
  }

  #btn {
    position: absolute;
    transform: translateY(-50%);
    left: 0;
    top: 19px;
    -webkit-app-region: no-drag;
    width: 22px;
    height: 22px;
    background: #333;
    cursor: pointer;
    transition: border-radius 0.5s;
    border: none;
    outline: none;
  }

  #btn.circle {
    border-radius: 50%;
    background: #333;
    border: 1.5px solid whitesmoke;
    outline: none;
  }

  body.collapsed {
    background: transparent !important;
  }

  body.collapsed #header {
    margin-bottom: 0;
    -webkit-app-region: no-drag;
  }

  body.collapsed #title,
  body.collapsed #content,
  body.collapsed #input-area,
  body.collapsed #composer-dock {
    display: none !important;
  }

  #title {
    position: absolute;
    left: 40px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #333;
    font-family: 'DM Mono', monospace;
  }

  #content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
    overflow-y: auto;
  }

  .bubble {
    background: rgba(255, 253, 253, 0.5);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    color: #151515;
    max-width: 80%;
    font-family: 'IBM Plex Mono', monospace;
    flex-shrink: 0;
  }

  #input-area {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    margin-top: auto;
    flex-shrink: 0;
    min-width: 0;
    width: 100%;
  }

  #composer-dock {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding-top: 12px;
    flex-shrink: 0;
    min-width: 0;
    width: 100%;
  }

  #composer-dock.open {
    display: flex;
  }

  #composer-dock .dock-row {
    display: flex;
    gap: 8px;
    min-width: 0;
    width: 100%;
    align-items: center;
  }

  input {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(0,0,0,0.15);
    background: white;
    font-size: 13px;
    outline: none;
    font-family: 'IBM Plex Mono', monospace;
  }

  button {
    flex-shrink: 0;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: #555;
    color: rgb(211, 211, 211);
    font-size: 13px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }

  .action-row {
    display: flex;
    gap: 8px;
    max-width: 80%;
    margin-top: -4px;
    flex-shrink: 0;
  }

  .action-row button {
    padding: 6px 14px;
    font-size: 12px;
  }

  .action-row button.cancel {
    background: rgba(255, 253, 253, 0.5);
    color: #151515;
    border: 1px solid rgba(0,0,0,0.15);
  }

  .action-row button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  @keyframes composer-drop {
    from { opacity: 0; transform: translateY(-8px) scaleY(0.92); }
    to   { opacity: 1; transform: translateY(0) scaleY(1); }
  }

  .composer {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    flex-shrink: 0;
    border-radius: 12px;
    background: rgba(255, 253, 253, 0.28);
    border: 1px solid rgba(255,255,255,0.35);
    overflow: hidden;
    transform-origin: top center;
    animation: composer-drop 320ms ease-out;
    font-family: 'IBM Plex Mono', monospace;
    color: #151515;
  }

  .composer-head,
  .composer-body {
    padding: 10px 12px;
  }

  .composer textarea {
    min-height: 72px;
    max-height: 28vh;
    resize: vertical;
  }

  #composer-dock .icon-btn,
  #composer-dock .gen-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }

  #composer-dock .icon-btn {
    background: rgba(255, 253, 253, 0.5);
    color: #151515;
    border: 1px solid rgba(0,0,0,0.15);
  }

  #composer-dock .gen-btn {
    margin-left: auto;
    background: #555;
    color: rgb(211, 211, 211);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #composer-dock .icon-btn:focus-visible,
  #composer-dock .gen-btn:focus-visible {
    outline: 2px solid #333;
    outline-offset: 2px;
  }

  #composer-dock .icon-btn:disabled,
  #composer-dock .gen-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  #composer-dock .gen-btn .gen-pulse {
    display: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgb(211, 211, 211);
    flex-shrink: 0;
    animation: breathe 1.2s infinite ease-in-out;
  }

  #composer-dock .gen-btn.listening .gen-pulse {
    display: inline-block;
  }

  #composer-dock .gen-btn.listening,
  #composer-dock .gen-btn.transcribing,
  #composer-dock .gen-btn.drafting {
    animation: gen-listen 1.2s infinite ease-in-out;
  }

  @keyframes gen-listen {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.72; }
  }

  .composer-heard {
    margin-top: 8px;
    font-size: 11px;
    line-height: 1.3;
    color: #333;
    opacity: 0.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sr-live {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  #composer-dock .icon-btn svg,
  #composer-dock .gen-btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    display: block;
  }

  .composer-head {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 6px 8px;
    align-items: center;
    border-bottom: 1px solid rgba(0,0,0,0.12);
  }

  .composer .lbl {
    font-size: 11px;
    color: #333;
    opacity: 0.7;
  }

  .composer input,
  .composer textarea {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    font-family: inherit;
    font-size: 12px;
    color: #151515;
  }

  .composer .urgent {
    grid-row: 1 / span 2;
    grid-column: 3;
    align-self: start;
    padding: 5px 8px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.15);
    background: rgba(255,253,253,0.45);
    color: #151515;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }

  .composer .urgent.on {
    background: #555;
    color: rgb(211, 211, 211);
    border-color: transparent;
  }

  .composer-files {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 12px 8px;
  }

  .file-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    padding: 4px 8px;
    border-radius: 8px;
    background: rgba(255,253,253,0.5);
    border: 1px solid rgba(0,0,0,0.12);
    font-size: 11px;
  }

  .file-chip span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-chip button {
    border: none;
    background: transparent;
    color: #151515;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    padding: 0;
    line-height: 1;
  }
</style>
</head>
<body>

<div id="header">
  <div id="btn"></div>
  <span id="title">chelle</span>
</div>

<div id="content">
  <div class="bubble" id="greeting-bubble">…</div>
</div>

<div id="composer-dock">
  <div class="composer-files" id="composer-files" hidden></div>
  <div class="dock-row">
    <input type="file" id="composer-file-input" multiple hidden />
    <button type="button" class="icon-btn" id="composer-attach" title="attach files" aria-label="files">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/>
        <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
      </svg>
      files
    </button>
    <button type="button" class="icon-btn" id="composer-undo" title="undo last generate" aria-label="undo" disabled>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7v6h6"/>
        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 2.9L3 13"/>
      </svg>
      undo
    </button>
    <button type="button" class="gen-btn" id="composer-gen" title="tap to talk" aria-label="tap to talk">

        <path d="M12 19v3"/>

<div id="input-area">
  <input id="chat-input" type="text" placeholder="Ask me anything..." />
  <button id="send-btn" type="button">Send</button>
</div>

<script>
  const { ipcRenderer } = require('electron')
  const btn = document.getElementById('btn')
  const title = document.getElementById('title')
  const content = document.getElementById('content')
  const inputArea = document.getElementById('input-area')
  const composerDock = document.getElementById('composer-dock')
  const composerAttach = document.getElementById('composer-attach')
  const composerUndo = document.getElementById('composer-undo')
  const composerGen = document.getElementById('composer-gen')
  const composerLive = document.getElementById('composer-live')
  const composerFileInput = document.getElementById('composer-file-input')
  const composerFiles = document.getElementById('composer-files')
  const body = document.querySelector('body')
  

  let collapsed = false
  let pointerOnBtn = false
  let ignoreMouse = true
  let savedheight = 600
  const CENTER = 170
  let skipNextClick = false
  const CONVERSATION_STORAGE_KEY = 'michelle_conversation_id'
  const USER_STORAGE_KEY = 'michelle_user_id'
  let conversationId = localStorage.getItem(CONVERSATION_STORAGE_KEY)
  let userId = localStorage.getItem(USER_STORAGE_KEY)
  const greetingBubble = document.getElementById('greeting-bubble')

  // Session = Electron UI open. Backend ctrl+c restart is NOT a new session.
  // Asks for a name only if long-term memory does not already have one.
  function startSession() {
    fetch('http://127.0.0.1:8000/session/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversation_id: conversationId,
        user_id: userId
      })
    })
      .then(response => response.json())
      .then(data => {
        if (data.conversation_id) {
          conversationId = data.conversation_id
          localStorage.setItem(CONVERSATION_STORAGE_KEY, conversationId)
        }
        if (data.user_id) {
          userId = data.user_id
          localStorage.setItem(USER_STORAGE_KEY, userId)
        }
        const greeting = data.greeting || "What's up?"
        if (greetingBubble) {
          revealScramble(greetingBubble, greeting)
          if (data.action_type === "send_email" && data.task_status === "AWAITING_INPUT") {
            attachComposer(greetingBubble, data)
          }
        }
      })
      .catch(error => {
        console.error('Session start failed:', error)
        if (greetingBubble) {
          greetingBubble.innerText = "What's up?"
        }
      })
  }

  startSession()

  function setBtnHitTest(enabled) {
    // enabled=true means the orb should receive clicks (ignore mouse OFF)
    const nextIgnore = !enabled
    if (ignoreMouse === nextIgnore) return
    ignoreMouse = nextIgnore
    ipcRenderer.send('set-ignore-mouse', nextIgnore)
  }

  function syncCollapsedHitTest() {
    if (!collapsed) return
    setBtnHitTest(pointerOnBtn)
  }

  function setCollapsedMode(on) {
    collapsed = on
    if (on) {
      body.classList.add('collapsed')
      btn.classList.add('circle')
      content.style.display = 'none'
      inputArea.style.display = 'none'
      composerDock.classList.remove('open')
      title.style.opacity = '0'
      body.style.background = 'transparent'
      body.style.border = 'none'
      body.style.boxShadow = 'none'
      // Cursor is usually still on the btn after collapse — mouseenter won't re-fire.
      pointerOnBtn = true
      ipcRenderer.sendSync('collapse', true) // starts click-through
      ignoreMouse = true // match main process state
      syncCollapsedHitTest() // re-enable hits while pointer is on the orb
    } else {
      body.classList.remove('collapsed')
      btn.classList.remove('circle')
      btn.style.removeProperty('border')
      content.style.display = 'flex'
      inputArea.style.display = 'flex'
      inputArea.style.marginTop = 'auto'
      if (activeComposer) composerDock.classList.add('open')
      body.style.background = 'rgba(233, 233, 246, 0.35)'
      body.style.removeProperty('border')
      body.style.removeProperty('box-shadow')
      ipcRenderer.sendSync('collapse', false)
      ignoreMouse = false
    }
  }

// Handle the collapse button click.

  btn.addEventListener('click', () => {
    if (skipNextClick) { skipNextClick = false; return }
    if (collapsed) return
    savedheight = body.clientHeight

    // Morph to circle, fade UI, roll panel up — window size stays put.
    btn.classList.add('circle')

    anime({ targets: title, opacity: 0, duration: 200, easing: 'linear' })
    anime({
      targets: [content, inputArea, composerDock],
      opacity: 0,
      duration: 200,
      easing: 'linear',
      complete: () => {
        content.style.display = 'none'
        inputArea.style.display = 'none'
        composerDock.classList.remove('open')
      }
    })
    anime({
      targets: body,
      height: 56,
      duration: 500,
      easing: 'easeInOutSine',
      complete: () => setCollapsedMode(true)
    })
  })

  // Forwarded mousemove keeps hit-testing in sync even when enter/leave skip a cycle.
  document.addEventListener('mousemove', (e) => {
    if (!collapsed) return
    const over = e.target === btn || btn.contains(e.target)
    if (over === pointerOnBtn) return
    pointerOnBtn = over
    setBtnHitTest(over)
  })

  document.addEventListener('mouseleave', () => {
    if (!collapsed) return
    pointerOnBtn = false
    setBtnHitTest(false)
  })

  btn.addEventListener('mouseenter', () => {
    pointerOnBtn = true
    if (collapsed) setBtnHitTest(true)
  })
  btn.addEventListener('mouseleave', () => {
    pointerOnBtn = false
    if (collapsed) setBtnHitTest(false)
  })

// Handle dragging the window when collapsed.

  let dragStartScreen = null

  btn.addEventListener('mousedown', (e) => {
    if (!collapsed) return
    e.preventDefault()
    pointerOnBtn = true
    setBtnHitTest(true)

    dragStartScreen = { x: e.screenX, y: e.screenY }
    ipcRenderer.send('drag-start', { screenX: e.screenX, screenY: e.screenY })

    function onDragEnd(e) {
      document.removeEventListener('mouseup', onDragEnd)
      ipcRenderer.send('drag-stop')

      const dx = Math.abs(e.screenX - dragStartScreen.x)
      const dy = Math.abs(e.screenY - dragStartScreen.y)
      dragStartScreen = null

// If the mouse didn't move much, treat it as a click to expand.

      if (dx < 5 && dy < 5) {
        skipNextClick = true
        setCollapsedMode(false)
        body.style.height = '56px'
        content.style.opacity = '0'
        inputArea.style.opacity = '0'
        composerDock.style.opacity = '0'
        title.style.opacity = '0'

        anime({
          targets: body,
          height: savedheight,
          duration: 500,
          easing: 'easeInOutSine',
          complete: () => { body.style.removeProperty('height') }
        })
        anime({ targets: title, opacity: 1, duration: 300, delay: 200, easing: 'linear' })
        anime({ targets: [content, inputArea, composerDock], opacity: 1, duration: 300, delay: 200, easing: 'linear' })
      } else if (collapsed) {
        syncCollapsedHitTest()
      }
    }

    document.addEventListener('mouseup', onDragEnd)
  })



const sendButton = document.getElementById('send-btn');
const inputBox = document.getElementById('chat-input');
const chatContainer = document.getElementById('content');

// Handle sending messages and thinking animation for bot responses.

function addBubble(text, sender) {
  const newBubble = document.createElement('div');
  newBubble.classList.add('bubble');
  newBubble.innerText = text;

  if (sender === 'user') {
    newBubble.style.marginLeft = 'auto'; 
    newBubble.style.background = 'rgba(0,0,0,0.2)';
  }

  content.appendChild(newBubble); 
  content.scrollTop = content.scrollHeight;

  return newBubble; 
}

// Function to reveal the bot's response with a scramble text.

function revealScramble(element, finalString) {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let iterations = 0;
  
  const interval = setInterval(() => {
    let scrambledText = "";
    
    for (let i = 0; i < finalString.length; i++) {
      if (i < iterations) {
        scrambledText += finalString[i];
      } else if (finalString[i] === ' ') {
        scrambledText += ' '; 
      } else {
        scrambledText += chars[Math.floor(Math.random() * chars.length)]; 
      }
    }
    
    element.innerText = scrambledText;

    if (iterations >= finalString.length) {
      clearInterval(interval);
    }
    
    iterations += 1/2; 
  }, 10); 
}

// Confirm/Cancel buttons for high-risk actions (SPEC-PIPELINE §9).
// Only one action can be pending at a time, so only one row ever lives.

let activeActionRow = null;
let activeComposer = null;

const DRAFT_TIMEOUT_MS = 120000
let micGranted = false
let micPromptOpen = false
let genPress = null
let draftAbort = null

function setGenState(state) {
  const label = composerGen.querySelector('.gen-label')
  composerGen.classList.remove('listening', 'transcribing', 'drafting')
  composerGen.removeAttribute('aria-pressed')
  composerGen.removeAttribute('aria-busy')
  const busy = state === 'transcribing' || state === 'drafting'
  composerGen.disabled = busy
  if (state === 'listening') {
    composerGen.classList.add('listening')
    composerGen.setAttribute('aria-pressed', 'true')
    if (label) label.textContent = 'listening'
  } else if (state === 'transcribing') {
    composerGen.classList.add('transcribing')
    composerGen.setAttribute('aria-busy', 'true')
    if (label) label.textContent = 'transcribing'
  } else if (state === 'drafting') {
    composerGen.classList.add('drafting')
    composerGen.setAttribute('aria-busy', 'true')
    if (label) label.textContent = 'drafting'
  } else if (label) {
    label.textContent = state === 'default' ? 'tap' : state
  }
  if (composerLive) {
    const spoken = state === 'default' ? '' : (label ? label.textContent : state)
    composerLive.textContent = spoken
  }
}

function resetGenUi() {
  if (draftAbort) {
    draftAbort.abort()
    draftAbort = null
  }
  void stopMicCapture()
  genPress = null
  micPromptOpen = false
  setGenState('default')
  composerUndo.disabled = true
}

function stashUndo() {
  if (!activeComposer || !activeComposer._bodyInput) return
  activeComposer._undoBody = activeComposer._bodyInput.value
  activeComposer._undoFromTap = !!activeComposer._bodyFromTapGenerate
  composerUndo.disabled = false
}

function showHeard(text) {
  if (!activeComposer || !activeComposer._heard) return
  const line = String(text || '').replace(/\s+/g, ' ').trim()
  activeComposer._heard.hidden = !line
  activeComposer._heard.textContent = line
}

function draftFields() {
  return {
    recipient: activeComposer._toInput.value.trim(),
    subject: activeComposer._subjectInput.value.trim(),
    body: activeComposer._bodyInput.value,
    body_from_user: !activeComposer._bodyFromTapGenerate,
    conversation_id: conversationId,
    user_id: userId
  }
}

async function startMicCapture() {
  const out = await ipcRenderer.invoke('mic-start')
  if (out && out.ok) return
  const err = new Error((out && out.message) || 'mic start failed')
  err.name = (out && out.name) || 'Error'
  throw err
}

async function stopMicCapture() {
  try {
    const buf = await ipcRenderer.invoke('mic-stop')
    if (!buf || !buf.byteLength) return null
    return new Blob([buf], { type: 'audio/wav' })
  } catch (err) {
    return null
  }
}

async function fetchDraft(init) {
  const ctrl = new AbortController()
  draftAbort = ctrl
  const timer = setTimeout(() => ctrl.abort(), DRAFT_TIMEOUT_MS)
  try {
    const r = await fetch('http://127.0.0.1:8000/action/draft_body', {
      ...init,
      signal: ctrl.signal
    })
    try {
      return await r.json()
    } catch (e) {
      return { error: 'network' }
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return { error: 'timeout' }
    return { error: 'network' }
  } finally {
    clearTimeout(timer)
    if (draftAbort === ctrl) draftAbort = null
  }
}

function applyDraftResult(out, fromVoice) {
  if (!activeComposer || !activeComposer._bodyInput) {
    setGenState('default')
    return
  }
  if (out && out.error) {
    if (out.error === 'heard_nothing') setGenState('heard nothing')
    else if (out.error === 'downloading') setGenState('downloading')
    else if (out.error === 'busy') setGenState('busy')
    else if (out.error === 'whisper_missing') setGenState('whisper missing')
    else setGenState('default')
    return
  }
  if (out && typeof out.body === 'string' && out.body.length > 0) {
    stashUndo()
    activeComposer._bodyInput.value = out.body
    activeComposer._bodyFromTapGenerate = !fromVoice
    if (fromVoice) showHeard(out.transcript)
    else showHeard('')
    if (activeComposer._scheduleSync) activeComposer._scheduleSync()
  }
  setGenState('default')
}

async function voiceDraft(blob) {
  if (!activeComposer) {
    setGenState('default')
    return
  }
  setGenState('transcribing')
  const fields = draftFields()
  const form = new FormData()
  form.append('recipient', fields.recipient)
  form.append('subject', fields.subject)
  form.append('body', fields.body)
  form.append('body_from_user', fields.body_from_user ? 'true' : 'false')
  form.append('conversation_id', fields.conversation_id || '')
  form.append('user_id', fields.user_id || '')
  form.append('audio', blob, 'hold.wav')
  const out = await fetchDraft({ method: 'POST', body: form })
  applyDraftResult(out, true)
}

async function finishListen() {
  if (!genPress || genPress.closing) return
  genPress.closing = true
  genPress.live = false
  const blob = await stopMicCapture()
  genPress = null
  if (blob) voiceDraft(blob)
  else setGenState('heard nothing')
}

async function startListen() {
  if (!activeComposer || composerGen.disabled || genPress) return
  genPress = { live: true, steal: false, closing: false }
  setGenState('listening')

  if (!micGranted) {
    const status = (() => {
      try { return ipcRenderer.sendSync('microphone-status') || {} }
      catch (err) { return {} }
    })()
    if (status.granted) {
      micGranted = true
    } else if (status.status === 'not-determined') {
      micPromptOpen = true
      let perm
      try {
        perm = await ipcRenderer.invoke('ask-microphone')
      } catch (err) {
        perm = { granted: false, prompted: true }
      }
      micPromptOpen = false
      micGranted = !!perm.granted
      genPress = null
      setGenState(perm.granted ? 'default' : 'mic blocked')
      return
    } else {
      genPress = null
      setGenState('mic blocked')
      return
    }
  }

  try {
    await startMicCapture()
  } catch (err) {
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')
    void stopMicCapture()
    genPress = null
    if (denied) {
      micGranted = false
      setGenState('mic blocked')
      return
    }
    setGenState('default')
    return
  }

  if (!genPress || genPress.closing || !genPress.live) {
    void finishListen()
  }
}

function onGenTap(e) {
  if (e.button != null && e.button !== 0) return
  if (!activeComposer || composerGen.disabled) return
  e.preventDefault()
  if (micPromptOpen) return
  if (genPress && genPress.live && !genPress.closing) {
    void finishListen()
    return
  }
  if (genPress) return
  void startListen()
}

function removeActionButtons() {
  if (!activeActionRow) return;
  activeActionRow.remove();
  activeActionRow = null;
}

function removeComposer() {
  if (!activeComposer) return;
  if (activeComposer._syncTimer) {
    clearTimeout(activeComposer._syncTimer());
  }
  activeComposer.remove();
  activeComposer = null;
  composerDock.classList.remove("open");
  composerFiles.hidden = true;
  composerFiles.innerHTML = "";
  composerFileInput.value = "";
  resetGenUi();
}

function attachComposer(bubble, data) {
  if (data.action_type !== "send_email" || data.task_status !== "AWAITING_INPUT") return;
  removeComposer();
  removeActionButtons();

  const resolved = data.resolved_params || {};
  const composer = document.createElement("div");
  composer.className = "composer";
  composer.innerHTML = `
    <div class="composer-head">
      <span class="lbl">to</span>
      <input type="text" class="composer-to" placeholder="name or email" />
      <button type="button" class="urgent">urgent?</button>
      <span class="lbl">subject</span>
      <input type="text" class="composer-subject" placeholder="what's this about" />
    </div>
    <div class="composer-body">
      <div class="lbl" style="margin-bottom:6px">body</div>
      <textarea class="composer-body-text" placeholder="write it here, or tap the mic"></textarea>
      <div class="composer-heard" hidden aria-live="polite"></div>
    </div>
  `;

  const toInput = composer.querySelector(".composer-to");
  const subjectInput = composer.querySelector(".composer-subject");
  const bodyInput = composer.querySelector(".composer-body-text");
  const heard = composer.querySelector(".composer-heard");
  const urgentBtn = composer.querySelector(".urgent");
  const attached = [];

  toInput.value = resolved.recipient || "";
  subjectInput.value = resolved.subject || "";
  bodyInput.value = resolved.body || "";
  if (/^\[urgent\]/i.test(subjectInput.value)) urgentBtn.classList.add("on");

  urgentBtn.addEventListener("click", () => {
    urgentBtn.classList.toggle("on");
    if (urgentBtn.classList.contains("on")) {
      if (!/^\[urgent\]/i.test(subjectInput.value)) {
        subjectInput.value = subjectInput.value
          ? "[urgent] " + subjectInput.value
          : "[urgent] ";
      }
    } else {
      subjectInput.value = subjectInput.value.replace(/^\[urgent\]\s*/i, "");
    }
  });

  function renderFiles() {
    composerFiles.hidden = attached.length === 0;
    composerFiles.innerHTML = "";
    attached.forEach((file, i) => {
      const chip = document.createElement("div");
      chip.className = "file-chip";
      const name = document.createElement("span");
      name.textContent = file.name;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.textContent = "×";
      remove.addEventListener("click", () => {
        attached.splice(i, 1);
        renderFiles();
      });
      chip.appendChild(name);
      chip.appendChild(remove);
      composerFiles.appendChild(chip);
    });
  }

  function readDraft() {
    return {
      to: toInput.value.trim(),
      subject: subjectInput.value.trim(),
      body: bodyInput.value.trim(),
      paths: attached.map((f) => f.path).filter(Boolean)
    };
  }

  composer._readDraft = readDraft;
  composer._attached = attached;
  composer._renderFiles = renderFiles;
  composer._toInput = toInput;
  composer._subjectInput = subjectInput;
  composer._bodyInput = bodyInput;
  composer._heard = heard;
  composer._bodyFromTapGenerate = false;
  composer._undoBody = null;
  composer._undoFromTap = false;

  let syncTimer = null;
  function scheduleSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncDraft, 1500);
  }
  function syncDraft() {
    if (!activeComposer || activeComposer !== composer || !composer._readDraft) return;
    const draft = composer._readDraft();
    fetch("http://127.0.0.1:8000/action/sync_draft", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        recipient: draft.to,
        subject: draft.subject,
        body: draft.body,
        conversation_id: conversationId,
        user_id: userId
      })
    }).catch((error) => console.error("Draft sync failed:", error));
  }
  composer._syncTimer = () => syncTimer;
  composer._scheduleSync = scheduleSync;

  toInput.addEventListener("input", scheduleSync);
  subjectInput.addEventListener("input", scheduleSync);
  urgentBtn.addEventListener("click", scheduleSync);

  bodyInput.addEventListener("input", () => {
    composer._bodyFromTapGenerate = false;
    scheduleSync();
  });
  composer._focusMissing = function () {
    if (!toInput.value.trim()) toInput.focus();
    else if (!subjectInput.value.trim()) subjectInput.focus();
    else bodyInput.focus();
  };

  bodyInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitComposer();
    }
  });

  bubble.insertAdjacentElement("afterend", composer);
  content.scrollTop = content.scrollHeight;
  activeComposer = composer;
  composerDock.classList.add("open");
  toInput.focus();
}

composerAttach.addEventListener("click", () => {
  if (!activeComposer) return;
  composerFileInput.click();
});
composerFileInput.addEventListener("change", () => {
  if (!activeComposer || !activeComposer._attached) return;
  activeComposer._attached.push(...Array.from(composerFileInput.files || []));
  composerFileInput.value = "";
  activeComposer._renderFiles();
});
composerUndo.addEventListener("click", () => {
  if (!activeComposer || activeComposer._undoBody == null) return;
  activeComposer._bodyInput.value = activeComposer._undoBody;
  activeComposer._bodyFromTapGenerate = !!activeComposer._undoFromTap;
  activeComposer._undoBody = null;
  composerUndo.disabled = true;
  showHeard('');
});

composerGen.addEventListener("click", onGenTap);
composerGen.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  onGenTap(e);
});


function submitComposer() {
  if (!activeComposer || !activeComposer._readDraft) return false;
  const draft = activeComposer._readDraft();
  if (!draft.to || !draft.subject || !draft.body) {
    activeComposer._focusMissing();
    return true;
  }
  if (activeComposer._syncTimer) {
    clearTimeout(activeComposer._syncTimer());
  }
  removeComposer();
  const botBubble = addBubble("", "bot");
  botBubble.innerHTML = '<div class="loading-dot"></div>';
  fetch("http://127.0.0.1:8000/action/submit_draft", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      recipient: draft.to,
      subject: draft.subject,
      body: draft.body,
      conversation_id: conversationId,
      user_id: userId,
      attachments: draft.paths
    })
  })
    .then((response) => response.json())
    .then((data) => {
      if (data.conversation_id) {
        conversationId = data.conversation_id;
        localStorage.setItem(CONVERSATION_STORAGE_KEY, conversationId);
      }
      if (data.user_id) {
        userId = data.user_id;
        localStorage.setItem(USER_STORAGE_KEY, data.user_id);
      }
      setTimeout(() => {
        revealScramble(botBubble, data.answer);
        attachConfirmButtons(botBubble, data);
        attachComposer(botBubble, data);
      }, 1200);
    })
    .catch((error) => {
      console.error("Composer submit failed:", error);
      revealScramble(botBubble, "Something went wrong.");
    });
  return true;
}

function attachConfirmButtons(bubble, data) {
  if (data.confirm_required !== true || !data.task_id) return;
  removeActionButtons();
  removeComposer();

  const taskId = data.task_id;
  const row = document.createElement('div');
  row.classList.add('action-row');

  const confirmBtn = document.createElement('button');
  confirmBtn.innerText = 'Confirm';
  const cancelBtn = document.createElement('button');
  cancelBtn.classList.add('cancel');
  cancelBtn.innerText = 'Cancel';

  // Removes this row only — never a newer row installed by a later /chat turn.
  function removeThisRow() {
    row.remove();
    if (activeActionRow === row) activeActionRow = null;
  }

  function sendDecision(decision) {
    if (confirmBtn.disabled) return;
    confirmBtn.disabled = true;
    cancelBtn.disabled = true;

    const botBubble = addBubble('', 'bot');
    botBubble.innerHTML = '<div class="loading-dot"></div>';

    fetch('http://127.0.0.1:8000/action/confirm', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          task_id: taskId,
          decision: decision,
          conversation_id: conversationId,
          user_id: userId
        })
      })
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(result => {
        removeThisRow();
        setTimeout(() => {
          revealScramble(botBubble, result.answer);
          attachConfirmButtons(botBubble, result);
        }, 1200);
      })
      .catch(error => {
        console.error('Action confirm failed:', error);
        removeThisRow();
        revealScramble(botBubble, 'Something went wrong.');
      });
  }

  confirmBtn.addEventListener('click', () => sendDecision('confirm'));
  cancelBtn.addEventListener('click', () => sendDecision('cancel'));

  row.appendChild(confirmBtn);
  row.appendChild(cancelBtn);
  bubble.insertAdjacentElement('afterend', row);
  content.scrollTop = content.scrollHeight;
  activeActionRow = row;
}

// Function to handle sending user messages and fetching bot responses.

function handleSend() {
  const userText = inputBox.value;
  if (userText.trim() === "") {
    if (activeComposer) {
      submitComposer();
      return;
    }
    return;
  }

  removeActionButtons();

  addBubble(userText, 'user');
  inputBox.value = '';

  const botBubble = addBubble('', 'bot');
  botBubble.innerHTML = '<div class="loading-dot"></div>';

  fetch('http://127.0.0.1:8000/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({
        text: userText,
        conversation_id: conversationId,
        user_id: userId
      })
    })
    .then(response => response.json()) 
    .then(data => {
      if (data.conversation_id) {
        conversationId = data.conversation_id
        localStorage.setItem(CONVERSATION_STORAGE_KEY, conversationId)
      }
      if (data.user_id) {
        userId = data.user_id
        localStorage.setItem(USER_STORAGE_KEY, userId)
      }
      setTimeout(()=>{
        let botReply = data.answer;
        revealScramble(botBubble, botReply);
        attachConfirmButtons(botBubble, data);
        if (data.asked_to_save_draft || data.task_status !== "AWAITING_INPUT") {
          removeComposer();
        } else {
          attachComposer(botBubble, data);
        }
      }, 1200);
    })

     
    .catch(error => {
      
      console.error('Error:', error);
      revealScramble(botBubble, "System Error: Connection to backend lost.");
    });
  }

// Event listeners for sending messages on button click or pressing Enter key.

sendButton.addEventListener('click', handleSend);
inputBox.addEventListener('keypress', (event) => {
  if (event.key === 'Enter') {
    handleSend();
  }
});





</script>
