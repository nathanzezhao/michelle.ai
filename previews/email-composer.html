<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Michelle — email composer preview</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 10%, #d4d0f0 0%, transparent 50%),
        radial-gradient(900px 500px at 90% 80%, #c9e4d4 0%, transparent 45%),
        linear-gradient(160deg, #8aa0b8 0%, #6b7c8d 45%, #4a5560 100%);
    }

    .stage {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .hint {
      color: rgba(0, 0, 0, 0.85);
      font-family: "DM Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    .window {
      width: 380px;
      height: 600px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(233, 233, 246, 0.35);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    #header {
      position: relative;
      height: 40px;
      margin-bottom: 12px;
      font-family: "DM Mono", monospace;
    }

    #btn {
      position: absolute;
      left: 0;
      top: 19px;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      background: #333;
      border: none;
    }

    #title {
      position: absolute;
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #333;
    }

    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow-y: auto;
    }

    .bubble {
      background: rgba(255, 253, 253, 0.5);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #151515;
      max-width: 80%;
      font-family: "IBM Plex Mono", monospace;
    }

    .bubble.user {
      margin-left: auto;
      background: rgba(0,0,0,0.2);
    }

    .composer {
      width: 100%;
      max-width: 100%;
      border-radius: 12px;
      background: rgba(255, 253, 253, 0.28);
      border: 1px solid rgba(255,255,255,0.35);
      overflow: hidden;
      transform-origin: top center;
      animation: drop 320ms ease-out;
      font-family: "IBM Plex Mono", monospace;
      color: #151515;
    }

    @keyframes drop {
      from { opacity: 0; transform: translateY(-8px) scaleY(0.92); }
      to   { opacity: 1; transform: translateY(0) scaleY(1); }
    }

    .composer-head,
    .composer-body,
    .composer-foot {
      padding: 10px 12px;
    }

    .composer-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 6px 8px;
      align-items: center;
      border-bottom: 1px solid rgba(0,0,0,0.12);
    }

    .lbl {
      font-size: 11px;
      color: #333;
      opacity: 0.7;
    }

    .composer input,
    .composer textarea {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 12px;
      color: #151515;
    }

    .composer input::placeholder,
    .composer textarea::placeholder {
      color: #444;
      opacity: 1;
    }

    .composer textarea {
      min-height: 120px;
      resize: none;
    }

    .urgent {
      grid-row: 1 / span 2;
      grid-column: 3;
      align-self: start;
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,253,253,0.45);
      color: #151515;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }

    .urgent.on {
      background: #555;
      color: rgb(211, 211, 211);
      border-color: transparent;
    }

    .composer-body { padding-top: 8px; }

    .composer-heard {
      margin-top: 8px;
      font-size: 11px;
      line-height: 1.3;
      color: #333;
      opacity: 0.7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .composer-files {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #composer-dock {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 12px;
      flex-shrink: 0;
      width: 100%;
    }

    #composer-dock .dock-row {
      display: flex;
      gap: 8px;
      min-width: 0;
      width: 100%;
      align-items: center;
    }

    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255,253,253,0.5);
      border: 1px solid rgba(0,0,0,0.12);
      font-size: 11px;
    }

    .file-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-chip button {
      border: none;
      background: transparent;
      color: #151515;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      padding: 0;
      line-height: 1;
    }

    .icon-btn,
    .gen-btn {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      font-size: 13px;
    }

    .icon-btn {
      background: rgba(255,253,253,0.5);
      color: #151515;
      border: 1px solid rgba(0,0,0,0.15);
    }

    .icon-btn svg,
    .gen-btn svg {
      width: 16px;
      height: 16px;
      display: block;
      flex-shrink: 0;
    }

    .gen-btn {
      margin-left: auto;
      background: #555;
      color: rgb(211, 211, 211);
      touch-action: none;
      user-select: none;
    }

    .icon-btn:focus-visible,
    .gen-btn:focus-visible {
      outline: 2px solid #333;
      outline-offset: 2px;
    }

    .icon-btn:disabled,
    .gen-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .gen-btn .gen-pulse {
      display: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgb(211, 211, 211);
      animation: breathe 1.2s infinite ease-in-out;
    }

    .gen-btn.listening .gen-pulse {
      display: inline-block;
    }

    .gen-btn.listening,
    .gen-btn.transcribing,
    .gen-btn.drafting {
      animation: gen-listen 1.2s infinite ease-in-out;
    }

    @keyframes breathe {
      0% { transform: scale(0.8); opacity: 0.1; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.1; }
    }

    @keyframes gen-listen {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.72; }
    }

    #input-area {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      margin-top: auto;
    }

    #input-area input {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(157, 155, 155, 0.15);
      background: white;
      font-size: 13px;
      outline: none;
      font-family: "IBM Plex Mono", monospace;
    }

    #input-area button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: #555;
      color: rgb(0, 0, 0);
      font-size: 13px;
      cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="hint">preview only — not wired to Michelle yet</div>
    <div class="window">
      <div id="header">
        <div id="btn"></div>
        <span id="title">chelle</span>
      </div>
      <div id="content">
        <div class="bubble">What's up?</div>
        <div class="bubble user">send an email</div>
        <div class="bubble">I can send that email — I just need who it's going to, the subject and the body.</div>
        <div class="composer" id="composer">
          <div class="composer-head">
            <span class="lbl">to</span>
            <input type="text" placeholder="email" />
            <button type="button" class="urgent" id="urgent">urgent?</button>
            <span class="lbl">subject</span>
            <input type="text" id="subject" placeholder="what's this about" />
          </div>
          <div class="composer-body">
            <div class="lbl" style="margin-bottom:6px">body</div>
            <textarea placeholder="write it here, or tap the mic"></textarea>
            <div class="composer-heard" aria-live="polite">make it shorter and warmer</div>
          </div>
        </div>
      </div>
      <div id="composer-dock">
        <div class="composer-files" id="files" hidden></div>
        <div class="dock-row">
          <input type="file" id="file-input" multiple hidden />
          <button type="button" class="icon-btn" id="attach" title="attach files" aria-label="files">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/>
              <path d="M14 2v5a1 1 0 0 0 1 1h5"/>
            </svg>
            files
          </button>
          <button type="button" class="icon-btn" id="undo" title="undo last generate" aria-label="undo" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 7v6h6"/>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 2.9L3 13"/>
            </svg>
            undo
          </button>
          <button type="button" class="gen-btn" id="gen" title="tap to talk" aria-label="tap to talk">
            <span class="gen-pulse" aria-hidden="true"></span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19v3"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <rect x="9" y="2" width="6" height="13" rx="3"/>
            </svg>
            <span class="gen-label">tap</span>
          </button>
        </div>
      </div>
      <div id="input-area">
        <input type="text" placeholder="Ask me anything..." />
        <button>Send</button>
      </div>
    </div>
  </div>
  <script>
    const urgent = document.getElementById("urgent");
    const subject = document.getElementById("subject");
    urgent.addEventListener("click", () => {
      urgent.classList.toggle("on");
      if (urgent.classList.contains("on")) {
        if (!/^\[urgent\]/i.test(subject.value)) {
          subject.value = subject.value ? "[urgent] " + subject.value : "[urgent] ";
        }
      } else {
        subject.value = subject.value.replace(/^\[urgent\]\s*/i, "");
      }
    });
    const fileInput = document.getElementById("file-input");
    const fileList = document.getElementById("files");
    const attached = [];

    function renderFiles() {
      fileList.hidden = attached.length === 0;
      fileList.innerHTML = "";
      attached.forEach((file, i) => {
        const chip = document.createElement("div");
        chip.className = "file-chip";
        const name = document.createElement("span");
        name.textContent = file.name;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.setAttribute("aria-label", "remove " + file.name);
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          attached.splice(i, 1);
          renderFiles();
        });
        chip.appendChild(name);
        chip.appendChild(remove);
        fileList.appendChild(chip);
      });
    }

    document.getElementById("attach").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      attached.push(...Array.from(fileInput.files || []));
      fileInput.value = "";
      renderFiles();
    });

    const gen = document.getElementById("gen");
    const undo = document.getElementById("undo");
    const box = document.querySelector("textarea");
    let prevBody = null;
    gen.addEventListener("click", () => {
      prevBody = box.value;
      undo.disabled = false;
      box.value = "(preview) Michelle would draft a body from the subject and who it's to — not wired yet.";
    });
    undo.addEventListener("click", () => {
      if (prevBody == null) return;
      box.value = prevBody;
      prevBody = null;
      undo.disabled = true;
    });
  </script>
</body>
</html>
